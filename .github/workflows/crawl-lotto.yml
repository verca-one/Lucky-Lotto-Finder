name: Crawl Lotto

on:
  schedule:
    # 매주 토요일 12:30 UTC (토요일 21:30 KST)
    - cron: '30 12 * * 6'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r gooddear/data/crawling/requirements.txt

    - name: Run lotto store scraping (최신 회차만)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python lotto_verca_crawler.py lotto latest

    - name: Collect winning numbers (최신 회차)
      run: |
        python lotto_verca_winning_numbers.py 5

    - name: Upload to Supabase
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python lotto_verca_uploader.py

    - name: Commit and push results
      run: |
        git config user.name "Lottery Bot"
        git config user.email "lottery-bot@github.com"
        git add -A
        git commit -m "Auto: Update lotto data - $(date '+%Y-%m-%d %H:%M:%S')" || true
        git push
