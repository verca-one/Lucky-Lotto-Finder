name: Crawl Lotto

on:
  schedule:
    # 매주 토요일 13:00 UTC (토요일 22:00 KST)
    - cron: '0 13 * * 6'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r gooddear/data/crawling/requirements.txt
        pip install supabase

    - name: Log crawl start
      id: log_start
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: |
        LOG_ID=$(python crawl_log_writer.py start lotto latest)
        echo "log_id=$LOG_ID" >> $GITHUB_OUTPUT

    - name: Run lotto store scraping (최신 회차만)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python lotto_verca_crawler.py lotto latest

    - name: Collect winning numbers (최신 회차)
      run: |
        python lotto_verca_winning_numbers.py 5

    - name: Upload to Supabase
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python lotto_verca_uploader.py

    - name: Recalculate store counts from winning_history (로또)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python recalculate_store_counts.py lotto

    - name: Recalculate badges (로또)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python recalculate_badges.py lotto --force

    - name: Verify crawl result (DB vs 공식 최신 회차)
      id: verify
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        VERIFY_OUT=$(python verify_crawl_result.py lotto)
        echo "$VERIFY_OUT"
        ROUND=$(echo "$VERIFY_OUT" | grep "CRAWL_ROUND_LOTTO=" | cut -d'=' -f2)
        if [ -n "$ROUND" ]; then
          echo "crawl_round=$ROUND" >> $GITHUB_OUTPUT
        fi

    - name: Log crawl success
      if: success()
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        ROUND="${{ steps.verify.outputs.crawl_round }}"
        ROUND_INFO="${ROUND:-latest}"
        python crawl_log_writer.py finish ${{ steps.log_start.outputs.log_id }} success

    - name: Log crawl failure
      if: failure()
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python crawl_log_writer.py finish ${{ steps.log_start.outputs.log_id }} failure "Workflow step failed"

    - name: Send email notification (success)
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "✅ 로또 크롤링 완료 (${{ steps.verify.outputs.crawl_round }}회)"
        body: |
          로또 크롤링이 성공적으로 완료되었습니다.

          최신 회차: ${{ steps.verify.outputs.crawl_round }}회
          Run ID: ${{ github.run_id }}
          Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: ${{ secrets.NOTIFY_EMAIL }}
        from: "Lottery Bot <lottery-bot@github.com>"

    - name: Send email notification (failure)
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "❌ 로또 크롤링 실패"
        body: |
          로또 크롤링이 실패했습니다. 확인이 필요합니다.

          Run ID: ${{ github.run_id }}
          Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: ${{ secrets.NOTIFY_EMAIL }}
        from: "Lottery Bot <lottery-bot@github.com>"

    - name: Commit and push results
      if: success()
      run: |
        git config user.name "Lottery Bot"
        git config user.email "lottery-bot@github.com"
        git add -A
        git commit -m "Auto: Update lotto data (${{ steps.verify.outputs.crawl_round }}회) - $(date '+%Y-%m-%d %H:%M:%S')" || true
        git push
