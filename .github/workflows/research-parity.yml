name: Research Parity

# 서버 단독 재현 검증 (읽기 전용): 서버(GitHub Actions)에서 기존 Dart 엔진으로 과거 회차를 다시 계산해
# DB에 저장된 결과와 같은지 확인한다. 쓰기 없음 (ResearchRuntime.serverWriter = false).
#   구매예측 pp-0.3 · 공식 최종 추천번호 fr-1.0 · 가설 순차 재현 hr-1.0
on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/tool/server/**'
      - '.github/workflows/research-parity.yml'
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Placeholder for local-only store JSON assets (엔진 미사용)
        run: |
          for f in $(grep -oE "assets/[^ ]+\.json" pubspec.yaml); do [ -f "$f" ] || echo '[]' > "$f"; done
      - run: flutter pub get
      - name: Parity — purchase / final recommendation / hypothesis replay (target 1246)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PARITY_TARGET: '1246'
        run: >
          flutter test --reporter expanded
          tool/server/purchase_parity_test.dart
          tool/server/final_rec_parity_test.dart
          tool/server/hypothesis_replay_parity_test.dart
