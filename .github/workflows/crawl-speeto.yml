name: Crawl Speeto

on:
  schedule:
    # 수요일 22:00 KST = 수요일 13:00 UTC / 금요일 22:00 KST = 금요일 13:00 UTC
    - cron: '0 13 * * 3'
    - cron: '0 13 * * 5'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r gooddear/data/crawling/requirements.txt
        pip install supabase

    - name: Log crawl start
      id: log_start
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: |
        LOG_ID=$(python crawl_log_writer.py start speeto latest)
        echo "log_id=$LOG_ID" >> $GITHUB_OUTPUT

    - name: Run speeto store scraping (최신 회차만)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python lotto_verca_crawler.py speed latest

    - name: Collect winning numbers (최신 회차)
      continue-on-error: true
      run: |
        python lotto_verca_winning_numbers.py 5

    - name: Upload to Supabase
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python lotto_verca_uploader.py

    - name: Recalculate store counts from winning_history (스피또)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python recalculate_store_counts.py speedlotto_2000
        python recalculate_store_counts.py speedlotto_1000
        python recalculate_store_counts.py speedlotto_500

    - name: Recalculate badges (스피또)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python recalculate_badges.py speedlotto_2000 --force
        python recalculate_badges.py speedlotto_1000 --force
        python recalculate_badges.py speedlotto_500 --force

    - name: Log crawl success
      if: success()
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python crawl_log_writer.py finish ${{ steps.log_start.outputs.log_id }} success

    - name: Log crawl failure
      if: failure()
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python crawl_log_writer.py finish ${{ steps.log_start.outputs.log_id }} failure "Workflow step failed"

    - name: Send email notification (success)
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "✅ 스피또 크롤링 완료"
        body: |
          스피또 크롤링이 성공적으로 완료되었습니다.

          Run ID: ${{ github.run_id }}
          Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: ${{ secrets.NOTIFY_EMAIL }}
        from: "Lottery Bot <lottery-bot@github.com>"

    - name: Send email notification (failure)
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "❌ 스피또 크롤링 실패"
        body: |
          스피또 크롤링이 실패했습니다. 확인이 필요합니다.

          Run ID: ${{ github.run_id }}
          Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: ${{ secrets.NOTIFY_EMAIL }}
        from: "Lottery Bot <lottery-bot@github.com>"

    - name: Commit and push results
      run: |
        git config user.name "Lottery Bot"
        git config user.email "lottery-bot@github.com"
        git add -A
        git commit -m "Auto: Update speeto data - $(date '+%Y-%m-%d %H:%M:%S')" || true
        git pull --rebase origin main || true
        git push
