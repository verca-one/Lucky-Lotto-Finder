name: Crawl Speeto

on:
  schedule:
    # 매주 금요일 21:00 UTC (토요일 06:00 KST)
    - cron: '0 21 * * 5'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r gooddear/data/crawling/requirements.txt

    - name: Run speeto store scraping (최신 회차만)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python lotto_verca_crawler.py speed latest

    - name: Collect winning numbers (최신 회차)
      run: |
        python lotto_verca_winning_numbers.py 5

    - name: Upload to Supabase
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python lotto_verca_uploader.py

    - name: Recalculate badges (스피또)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python recalculate_badges.py speedlotto_2000
        python recalculate_badges.py speedlotto_1000
        python recalculate_badges.py speedlotto_500

    - name: Commit and push results
      run: |
        git config user.name "Lottery Bot"
        git config user.email "lottery-bot@github.com"
        git add -A
        git commit -m "Auto: Update speeto data - $(date '+%Y-%m-%d %H:%M:%S')" || true
        git push
