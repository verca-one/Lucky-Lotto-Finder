name: Crawl Speeto (disabled)

# 비활성화 - 스피또 미사용
# on:
#   schedule:
#     - cron: '0 21 * * *'
#   workflow_dispatch:
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '수동 실행 확인 (현재 비활성화됨)'
        required: true

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r gooddear/data/crawling/requirements.txt

    - name: Run speeto store scraping (최신 회차만)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python lotto_verca_crawler.py speed latest

    - name: Collect winning numbers (최신 회차)
      run: |
        python lotto_verca_winning_numbers.py 5

    - name: Upload to Supabase
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python lotto_verca_uploader.py

    - name: Commit and push results
      run: |
        git config user.name "Lottery Bot"
        git config us