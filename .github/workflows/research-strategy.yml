name: Research Strategy

# AI 전략기획부(방향 제시) → 가설 공장(비서: 검증·유지·폐기·모의). 매일 17:00 KST — 새 가설 20 · 응용 10 · 판매점 10.
#   research_strategy_ai.py      : 키가 있는 AI(Claude: ANTHROPIC_API_KEY · Gemini: GEMINI_API_KEY)마다 하루 1번 제안
#   research_hypothesis_factory.py: 제안된 가설 검정 · 통과 가설 새 회차 추적 (유지/폐기)
#   research_store_hypothesis_apply.py: 검증 통과 판매점 가설을 다음 회차 판매점 예측에 반영 (적중 예측 순위 · 브리핑 ④)
#   research_speetto.py          : 스피또 — 게임별 1등 판매점 (데이터 검사 통과 시에만 공개)
#   research_pension.py          : 연금복권 — 명당 · 번호 엔진(당첨번호 50회부터) · 연금 가설 트랙 (브리핑·추천 '연금' 탭)
#   research_set_review.py       : 추천번호 복기 — 지난 회차 추천 20세트(4영역) vs 당첨번호 → 아쉬운 부분 → 제미나이 보완 규칙 (가설 트랙에 반영)
#   research_hypothesis_track.py : 가설 트랙 — 제미나이 가설을 최근 200회 기준으로 바로 써서 번호 5세트·명당 5곳 (브리핑 ⑤, 공개 후·마감 전)
# AI 는 strategy_directions · strategy_hypotheses(제안)에만 쓴다. 엔진·번호·장부·크롤링과 무관.
on:
  schedule:
    - cron: '5 8 * * *'   # 매일 17:05 KST — 제미나이 한도가 풀린 직후. 제미나이는 요일별로 나눠서 (research_ai_week.py)
  workflow_dispatch:
    inputs:
      parts:
        description: '다시 돌릴 제미나이 몫 (a7183,review,direction,pension,speetto · auto = 이번 주 실패분). 비우면 이번 주 실패 · 빠진 것'
        type: string
        default: ''
  # push 로는 돌리지 않음 — 푸쉬마다 제미나이 하루 한도(20번)를 써서 17시 실행 · 7183 이 밀렸음 (2026-11-26). 다시 돌리려면 연구소 › AI 부서 [새로고침]

concurrency:
  group: research-strategy
  cancel-in-progress: false

jobs:
  strategy:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'   # 취소돼도 어디서 멈췄는지 기록이 남게
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy scipy anthropic google-genai
      # 제미나이 요일 나눠 돌리기 — 월 7183 · 복기 / 화 전략기획부 / 수 연금 / 목 스피또 / 금 실패한 것만. 새로고침(수동)은 이번 주 실패 · 빠진 것만
      - name: 오늘 돌릴 제미나이 몫
        id: plan
        continue-on-error: true   # 못 정하면 제미나이 단계만 쉬고 나머지(가설 공장 · 연금 · 스피또 계산)는 그대로
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python research_ai_week.py ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }} --parts "${{ inputs.parts }}"
      # 7183 에이전트를 맨 먼저 — 아래 단계들이 제미나이 무료 한도(하루 20번)를 다 써서 17:10 의 7183 이 매번 한도 초과로 밀렸음
      #   7183 은 회차당 1번만 부르고 이미 꿈이 있으면 그냥 넘어감 (research-7183.yml 은 그대로 둠)
      - name: 7183 에이전트 — 제미나이 꿈 먼저 (한도 풀린 직후 1번)
        if: ${{ !cancelled() && contains(steps.plan.outputs.parts, 'a7183') }}
        continue-on-error: true
        timeout-minutes: 15   # 503 재시도 대기(6분 30초) 포함
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python research_7183.py --publish
      - name: AI 브리핑전담부서 — 지난 회차 추천 20세트 vs 당첨번호 → 영역별 유지/보완 · 보완 지시 (제미나이 상주 · 회차당 1번)
        if: ${{ !cancelled() && contains(steps.plan.outputs.parts, 'review') }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python research_set_review.py
      - name: AI 전략기획부 — 방향 제시 (Claude · Gemini, 키 있는 것만)
        continue-on-error: true
        timeout-minutes: 25   # 제미나이 로또 · 연금 · 스피또 각 7분까지 — 넘으면 뒤 단계로
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python research_strategy_ai.py --parts "${{ steps.plan.outputs.parts }}"
      - name: 가설 공장 — 비서 검증·유지·폐기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python research_hypothesis_factory.py
      - name: 판매점 가설 적용 — 적중 예측 순위 (지방장 확률 × 검증 가설 배수)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python research_store_hypothesis_apply.py
      - name: 가설 트랙 — 제미나이 가설 바로 실전 (번호 5세트 · 명당 5곳, 공개 후 · 마감 전 사전 등록)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python research_hypothesis_track.py
      - name: 연금복권 — 명당 · 번호 엔진 · 연금 가설 트랙 (목 18시 KST 이후 고정)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python research_pension.py
      - name: 스피또 — 게임별 1등 판매점 · 당첨점 추리(제미나이) (예전 잘못된 기록이면 공개 안 함)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPEETTO_AI: ${{ contains(steps.plan.outputs.parts, 'speetto') && '1' || '0' }}   # 추리(제미나이)는 목요일 몫 — 다른 날은 지난 추리 이어 씀
        run: python research_speetto.py
      - name: 연금 · 스피또 지방장 — 시·군·구별 TOP5 · 최근 성적
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python research_agent_extra.py
