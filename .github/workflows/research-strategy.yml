name: Research Strategy

# AI 전략기획부(방향 제시) → 가설 공장(비서: 검증·유지·폐기·모의). 매일 17:00 KST — 새 가설 20 · 응용 10 · 판매점 10.
#   research_strategy_ai.py      : 키가 있는 AI(Claude: ANTHROPIC_API_KEY · Gemini: GEMINI_API_KEY)마다 하루 1번 제안
#   research_hypothesis_factory.py: 제안된 가설 검정 · 통과 가설 새 회차 추적 (유지/폐기)
#   research_store_hypothesis_apply.py: 검증 통과 판매점 가설을 다음 회차 판매점 예측에 반영 (적중 예측 순위 · 브리핑 ④)
#   research_speetto.py          : 스피또 — 게임별 1등 판매점 (데이터 검사 통과 시에만 공개)
#   research_pension.py          : 연금복권 — 명당 · 번호 엔진(당첨번호 50회부터) · 연금 가설 트랙 (브리핑·추천 '연금' 탭)
#   research_set_review.py       : 추천번호 복기 — 지난 회차 추천 20세트(4영역) vs 당첨번호 → 아쉬운 부분 → 제미나이 보완 규칙 (가설 트랙에 반영)
#   research_hypothesis_track.py : 가설 트랙 — 제미나이 가설을 최근 200회 기준으로 바로 써서 번호 5세트·명당 5곳 (브리핑 ⑤, 공개 후·마감 전)
# AI 는 strategy_directions · strategy_hypotheses(제안)에만 쓴다. 엔진·번호·장부·크롤링과 무관.
on:
  schedule:
    - cron: '0 8 * * *'   # 17:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_strategy_ai.py'
      - 'research_hypothesis_factory.py'
      - 'research_store_hypotheses.py'
      - 'research_store_hypothesis_apply.py'
      - 'research_hypothesis_track.py'
      - 'research_set_review.py'
      - 'research_pension.py'
      - 'research_speetto.py'
      - 'research_agent_extra.py'
      - '.github/workflows/research-strategy.yml'

concurrency:
  group: research-strategy
  cancel-in-progress: false

jobs:
  strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy scipy anthropic google-genai
      - name: AI 전략기획부 — 방향 제시 (Claude · Gemini, 키 있는 것만)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python research_strategy_ai.py
      - name: 가설 공장 — 비서 검증·유지·폐기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python research_hypothesis_factory.py
      - name: 판매점 가설 적용 — 적중 예측 순위 (지방장 확률 × 검증 가설 배수)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python research_store_hypothesis_apply.py
      - name: 추천번호 복기 — 지난 회차 추천 20세트 vs 당첨번호 → 제미나이 보완 규칙 (회차당 1번)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python research_set_review.py
      - name: 가설 트랙 — 제미나이 가설 바로 실전 (번호 5세트 · 명당 5곳, 공개 후 · 마감 전 사전 등록)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python research_hypothesis_track.py
      - name: 연금복권 — 명당 · 번호 엔진 · 연금 가설 트랙 (목 18시 KST 이후 고정)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python research_pension.py
      - name: 스피또 — 게임별 1등 판매점 (예전 잘못된 기록이면 공개 안 함)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python research_speetto.py
      - name: 연금 · 스피또 지방장 — 시·군·구별 TOP5 · 최근 성적
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python research_agent_extra.py
