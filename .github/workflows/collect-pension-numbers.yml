name: Collect Pension Numbers

# 연금복권720+ 당첨번호 수집 (새 수집기 · 기존 판매점 크롤러와 별개)
#   동행복권 연금 결과 화면의 목록 주소 1번으로 전 회차 당첨번호를 받아, pension_winning_numbers 에 없는 회차만 추가한다.
#   실행당 요청 3번. 추첨: 매주 목 19:05 → 목 19:20~금 08:40 KST 20분마다
#   (GitHub 예약 실행이 몇 시간씩 밀리거나 빠질 때가 있어 자주 예약 · 이미 받았거나 추첨 전이면 동행복권 접속 없이 바로 끝)
on:
  schedule:
    - cron: '20,40 10 * * 4'      # 목 19:20 · 19:40 KST
    - cron: '*/20 11-14 * * 4'    # 목 20:00~23:40 KST
    - cron: '*/20 15-23 * * 4'    # 금 00:00~08:40 KST (= 목 15~23시 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pension_numbers_collector.py'
      - '.github/workflows/collect-pension-numbers.yml'

concurrency:
  group: collect-pension-numbers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 연금 당첨번호 수집 (없는 회차만 추가 · 덮어쓰기 없음)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pension_numbers_collector.py
