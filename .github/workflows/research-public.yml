name: Research Public

# 일반 사용자 공개 요약(구매예측번호 3세트 + 공개 연구 1개)을 research_v8_public.sql 의 공개 전용 테이블에 저장한다.
# research_results 는 읽기만 한다. 쓰기는 service_role 키(SUPABASE_SERVICE_KEY)로만 한다.
# 기존 크롤링 워크플로는 수정하지 않는다. 외부 사이트 접속 없음. (research_v8_public.sql 적용 2026-10-12)
on:
  push:
    branches: [main]
    paths:
      - 'research_public_worker.py'
      - '.github/workflows/research-public.yml'
  workflow_run:
    workflows: ["Research Worker"]
    types: [completed]
  schedule:
    - cron: '0 */3 * * *'   # 3시간마다 (관리자 앱이 새 구매예측 결과를 저장한 뒤 반영)
  workflow_dispatch:

concurrency:
  group: research-public
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Publish public summary
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python research_public_worker.py
