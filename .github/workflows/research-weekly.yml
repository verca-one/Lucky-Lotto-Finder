name: Research Weekly Check

# 토요일 아침 08:00 KST — 가설 공장 · 판매점 가설 · 추천번호 복기만 최신으로.
# 추천번호는 월요일 최초 생성본으로 확정 (2026-11-25): 토요일에 다시 뽑지 않는다. 주중 가설 · 복기 규칙은 다음 회차부터.
# (월요일 취합은 research-engine.yml publish 단계에서 엔진이 구매할 번호를 등록한 시점에 만든다)
on:
  schedule:
    - cron: '0 23 * * 5'  # 토 08:00 KST (= 금 23:00 UTC)
  workflow_dispatch:

concurrency:
  group: research-strategy
  cancel-in-progress: false

jobs:
  saturday:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy scipy google-genai
      - name: 가설 공장 — 최신 판정
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python research_hypothesis_factory.py
      - name: 판매점 다시 뽑기 — 검증 통과 판매점 가설 최신 반영 (브리핑 ④)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python research_store_hypothesis_apply.py
      - name: AI 브리핑전담부서(추천번호 복기) — 지난 회차 추천 20세트 vs 당첨번호 → 제미나이 보완 규칙 (회차당 1번)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python research_set_review.py
