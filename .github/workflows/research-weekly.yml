name: Research Weekly Check

# 비서 토요일 아침 최종 점검 — 08:00 KST. 가설 공장을 한 번 더 돌린 뒤 수요일 취합과 비교해 '변경점 있음/없음'을 남긴다.
# (수요일 취합은 research-engine.yml publish 단계에서 엔진이 구매할 번호를 등록한 시점에 만든다)
on:
  schedule:
    - cron: '0 23 * * 5'  # 토 08:00 KST (= 금 23:00 UTC)
  workflow_dispatch:

concurrency:
  group: research-strategy
  cancel-in-progress: false

jobs:
  saturday:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy scipy
      - name: 가설 공장 — 최신 판정
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python research_hypothesis_factory.py
      - name: 토요일 최종 점검 — 수요일 대비 변경점
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python research_weekly_digest.py --stage sat
