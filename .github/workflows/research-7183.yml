name: Research 7183 Agent

# 7183 에이전트 — 법칙 생태계 (법칙이 한동안 유효하다 다른 법칙으로 넘어가는 흐름을 추적 · 목표는 다음 회차 당첨)
#   research_7183.py : 세는 쪽(법칙 식 · 조수의 숫자 패턴 · 채점)은 서버 계산, 꿈꾸는 쪽(추리 · 새 순환 · 믿는 법칙)은 제미나이
# 제미나이는 회차당 1번만 부른다(이미 있으면 건너뜀). 제미나이가 실패하면 계산값만 저장하고 다음 실행에서 다시.
# 한도 초과(429)면 한도가 풀리는 시각(17:00 KST)까지 부르지 않고 기다린다 (저장본 quota_until).
# 번호 5세트는 월요일 0시(KST) 공개 뒤 첫 실행에서 한 번 등록하고 고정 — 그래서 토요일 추첨 뒤 ~ 월요일은 4시간마다 시도한다.
# 당첨번호(lotto_winning_numbers)를 읽기만 한다 — 크롤링 · 비인기 추천조합 · 공식 엔진과 무관.
on:
  schedule:
    - cron: '10 8 * * *'              # 매일 17:10 KST — 제미나이 무료 한도(하루 20번)가 풀린 직후
    - cron: '30 9 * * *'              # 매일 18:30 KST
    - cron: '0 14,18,22 * * 6'        # 토 추첨 뒤 (23시 · 일 03시 · 07시 KST)
    - cron: '0 2,6,10,14,18,22 * * 0' # 일 11시 ~ 월 07시 KST, 4시간마다
    - cron: '0 2,6 * * 1'             # 월 11시 · 15시 KST
  workflow_dispatch:
    inputs:
      late_sets:
        description: '계산 번호로 등록된 회차에 제미나이 번호를 별도 기록으로 추가 (월요일 번호는 그대로)'
        type: boolean
        default: false

concurrency:
  group: research-7183
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy scipy anthropic google-genai
      - name: 7183 에이전트 — 법칙 세기 · 지난 꿈 채점 · 제미나이 꿈 (회차당 1번)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python research_7183.py --publish ${{ inputs.late_sets && '--late-sets' || '' }}
