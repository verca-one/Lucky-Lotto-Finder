<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width: 1024px; height: 500px; overflow: hidden;
  font-family: 'Noto Sans KR', sans-serif;
  background: linear-gradient(135deg, #14103a 0%, #1a1250 40%, #231660 100%);
  position: relative;
}
.glow {
  position: absolute; width: 350px; height: 350px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,200,50,0.12) 0%, transparent 70%);
  top: 50px; left: 30px;
}
.left-panel {
  position: absolute; left: 55px; top: 40px; width: 380px; z-index: 10;
}
.app-icon {
  width: 90px; height: 90px; border-radius: 22px;
  box-shadow: 0 4px 20px rgba(255,200,50,0.3);
}
.title {
  margin-top: 16px;
  font-size: 42px; font-weight: 900; color: #FFD740;
  text-shadow: 0 2px 10px rgba(255,200,50,0.3);
  letter-spacing: -1px;
}
.subtitle {
  font-size: 18px; color: rgba(255,255,255,0.9); margin-top: 6px;
  font-weight: 400;
}
.features {
  margin-top: 18px; display: flex; flex-direction: column; gap: 8px;
}
.feat {
  display: flex; align-items: center; gap: 8px;
  font-size: 15px; color: rgba(220,220,240,0.9);
}
.feat-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #FFD740;
  flex-shrink: 0;
}
.balls {
  display: flex; gap: 10px; margin-top: 22px;
}
.ball {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
.phones {
  position: absolute; right: 20px; top: 0; height: 500px;
  display: flex; align-items: center; gap: -10px;
}
.phone {
  border-radius: 16px; overflow: hidden;
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  border: 3px solid rgba(255,255,255,0.2);
  flex-shrink: 0;
}
.phone img {
  display: block; height: 100%; width: auto;
}
.phone-left { height: 370px; position: absolute; right: 380px; top: 65px; z-index: 1; }
.phone-center { height: 420px; position: absolute; right: 200px; top: 40px; z-index: 2; }
.phone-right { height: 370px; position: absolute; right: 20px; top: 65px; z-index: 1; }
.gold-line {
  width: 200px; height: 2px; margin-top: 18px;
  background: linear-gradient(90deg, #FFD740, transparent);
}
</style>
</head>
